adapter: qlora
base_model: Muneerali199/RakshakAI-SecureCoder-7B-v1-merged
bf16: true
dataloader_num_workers: 4
dataloader_pin_memory: true
dataset_prepared_path: /data/prepared
datasets:
- chat_template: chatml
  field_messages: messages
  path: /data/axolotl/train.jsonl
  type: chat_template
eval_sample_max_num: 100
eval_steps: 500
eval_strategy: steps
flash_attention: true
gradient_accumulation_steps: 4
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
group_by_length: true
learning_rate: 0.0001
load_in_4bit: true
logging_dir: /data/logs
logging_steps: 10
lora_alpha: 32
lora_dropout: 0.05
lora_modules_to_save:
- embed_tokens
- lm_head
lora_r: 32
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj
lr_scheduler: cosine
micro_batch_size: 8
num_epochs: 1
optimizer: adamw_8bit
output_dir: /data/model_sft
pad_to_sequence_len: true
report_to: none
sample_packing: true
save_safetensors: true
save_steps: 500
save_strategy: steps
save_total_limit: 2
seed: 42
sequence_len: 4096
special_tokens:
  pad_token: <|endoftext|>
tf32: true
train_on_inputs: false
val_set_size: 0.01
warmup_ratio: 0.03
